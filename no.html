<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😭 ¿No?</title>

<style>

body{
    background: linear-gradient(to bottom,#fff0f5,#ffe6e6);
    font-family: Arial, sans-serif;
    text-align:center;
    padding:40px;
    color:#444;
}

h1{
    color:#e74c3c;
    font-size:54px;
}

img{
    width:320px;
    max-width:90%;
    border-radius:20px;
}

p{
    font-size:28px;
    line-height:1.5;
}

button{
    background:#ff5c8a;
    color:white;
    border:none;
    border-radius:30px;
    padding:15px 35px;
    font-size:24px;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    background:#e84370;
}

#respuesta{
    display:none;
    margin-top:30px;
    font-size:32px;
    color:#d63031;

}

</style>

</head>

<body>

<h1>😭 ¿No?</h1>

<img
src="https://media.tenor.com/P1W9KjJ7VhEAAAAC/crying-monkey.gif"
alt="Monhabía comprado boletos... 💔
</p>

<p>
¿Estás completamente segura? 🥺
</p>

<button onclick="mostrarRespuesta()">
Sí, estoy segura 😭
</button>

<div id="respuesta">

<p>
Bueno... 😢
</p>

<p>
Pero gracias por escanear el QR ❤️
</p>

<p>
(Última oportunidad de regresar al QR de "Sí") 😏
</p>

</div>

<audio id="audio">
<source src="https://www.soundjay.com/misc/sounds/fail-buzzer-02

<script>

function mostrarRespuesta(){

    document.getElementById("respuesta").style.display="block";

    try{
        document.getElementById("audio").play();
    }catch(e){}

}

</script>

</body>
</html>
